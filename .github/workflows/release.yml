name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...
      - run: go vet ./...
      - run: python scripts/validate-skill.py

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          version="${GITHUB_REF_NAME}"
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="codex-lan-handoff_${os}_${arch}"
              mkdir -p "build/$name"
              binary="codex-lan-handoff"
              [ "$os" = windows ] && binary="codex-lan-handoff.exe"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$version" -o "build/$name/$binary" ./cmd/codex-lan-handoff
              cp LICENSE "build/$name/LICENSE"
              if [ "$os" = windows ]; then
                (cd "build/$name" && zip -q "../../dist/$name.zip" "$binary" LICENSE)
              else
                tar -C "build/$name" -czf "dist/$name.tar.gz" "$binary" LICENSE
              fi
            done
          done
          (cd dist && find . -maxdepth 1 -type f ! -name checksums.txt -printf '%f\n' | sort | xargs sha256sum > checksums.txt)
      - name: Smoke-test Linux binaries
        run: |
          tar -xzf dist/codex-lan-handoff_linux_amd64.tar.gz -C /tmp
          test "$(/tmp/codex-lan-handoff version)" = "$GITHUB_REF_NAME"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
